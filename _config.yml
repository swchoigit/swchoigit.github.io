# Site Settings
title: Soonwoo Choi
url: "https://soonwoochoi.github.io"
domain: "soonwoochoi.github.io"
github_username: swchoigit

# Build settings
plugins:
  - jekyll-feed
  - jekyll-archives

# Conversion
highlighter: none

# Markdown Processing
kramdown:
  syntax_highlighter: null
  syntax_highlighter_opts:
    disable: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: ["import"]

# Outputting
permalink: /:categories/:year-:month-:day-:title/

# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: "/:name/"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
