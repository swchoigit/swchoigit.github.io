---
layout: default
---
{% assign posts = page.posts | default: site.posts %}

<ul class="archive">
  {% for post in posts %}
    <li onclick="location.href='{{ post.url | relative_url }}'">
      <span>{{ post.date | date: '%Y-%m-%d' }}</span>
      <h2>{{ post.title }}</h2>
      <p>{{ post.title }}</p>
    </li>
  {% endfor %}
</ul>
