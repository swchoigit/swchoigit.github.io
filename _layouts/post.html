---
layout: default
---
<article class="post">
  <div class="post-header">
    <span class="post-meta">{{ page.date | date: '%Y-%m-%d' }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
  <footer class="post-categories">
    {% for cate in page.categories %}
      <code>{{ cate }}</code>
      {%- unless forloop.last %}, {% endunless %}
    {% endfor %}
  </footer>
</article>
