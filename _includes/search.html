<button class="site-search">
  {% include icons/icon-search.html %}
</button>

<ninja-keys placeholder="Search {{ site.domain }}"> </ninja-keys>

<script type="module">
  const ninja = document.querySelector('ninja-keys');

  ninja.updateComplete?.then(() => {
    const modal = ninja.shadowRoot.querySelector('.modal-content');
    if (modal) {
      modal.style.backdropFilter = 'saturate(180%) blur(20px)';
      modal.style.webkitBackdropFilter = 'saturate(180%) blur(20px)';
    }
  });

  const response = await fetch('{{ "/search.json" | relative_url }}');
  const posts = await response.json();

  const modal = ninja.shadowRoot.querySelector('.modal-body');
  modal.style.display = 'none';

  ninja.addEventListener('change', (e) => {
    const query = e.detail.search.trim();
    const filtered = posts.filter((x) => x.title.toLowerCase().includes(query));

    if (query && filtered.length > 0) {
      modal.style.display = 'block';
      ninja.data = filtered.map((post) => ({
        id: post.url,
        title: post.title,
        section: 'Posts',
        handler: () => {
          window.location.href = post.url;
        },
      }));
    } else {
      modal.style.display = 'none';
      ninja.data = [];
    }
  });

  document.querySelector('.site-search').onclick = () => ninja.open();
</script>

<style>
  ninja-keys {
    --ninja-modal-background: rgba(255, 255, 255, 0.8);
  }

  ninja-keys::part(ninja-selected) {
    border: none;
  }
</style>
